name: Deploy milestonepm

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (if present)
        run: npm test --if-present

      - name: Build application
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: milestonehre
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            echo "🚀 Starting deployment"

            cd /home/milestonehre

            # Clone repo if missing
            if [ ! -d milestonepm ]; then
              git clone https://github.com/frontendmakaidigitals/milestonepm.git
            fi

            cd milestonepm

            echo "📥 Fetching latest code"
            git fetch origin
            git checkout master
            git reset --hard origin/master

            echo "📦 Installing dependencies"
            npm ci

            echo "🏗️ Building Next.js app"
            npm run build

            echo "♻️ Restarting PM2 process"
            pm2 delete milestonepm || true
            PORT=3005 pm2 start npm --name milestonepm -- start

            pm2 save

            echo "✅ Deployment complete"

  health-check:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Health check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: milestonehre
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "🔍 Checking app health"
            for i in {1..5}; do
              if curl -f http://localhost:3005 > /dev/null 2>&1; then
                echo "✅ Application is healthy"
                exit 0
              fi
              echo "⏳ Attempt $i failed, retrying..."
              sleep 10
            done

            echo "❌ Health check failed"
            exit 1
